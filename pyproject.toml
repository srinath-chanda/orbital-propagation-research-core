[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "orbital-propagation-research-core"
version = "0.1.0"
description = "Reproducible comparison and validation of low-Earth-orbit propagation models."
readme = "README.md"
requires-python = ">=3.11,<3.15"
authors = [
  {name = "Srinath Chanda"}
]
dependencies = [
  "numpy>=2,<3",
  "scipy>=1.14,<2",
  "matplotlib>=3.9,<4",
  "sgp4>=2.25,<3",
  "astropy>=7,<8"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: Other/Proprietary License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Astronomy"
]

[project.urls]
Repository = "https://github.com/srinath-chanda/orbital-propagation-research-core"
Issues = "https://github.com/srinath-chanda/orbital-propagation-research-core/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
